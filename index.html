<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Countdown</title>

<style>
* {
    box-sizing: border-box;
    }

    body {
        margin: 0;
            height: 100vh;
                background: #000;
                    color: white;
                        font-family: Arial, sans-serif;
                            display: flex;
                                justify-content: center;
                                    align-items: center;
                                        text-align: center;
                                        }

                                        .container {
                                            width: 90%;
                                            }

                                            h1 {
                                                font-size: 42px;
                                                    margin-bottom: 40px;
                                                    }

                                                    #countdown {
                                                        font-size: 80px;
                                                            font-weight: bold;
                                                                letter-spacing: 5px;
                                                                }

                                                                #message {
                                                                    display: none;
                                                                        font-size: 50px;
                                                                            font-weight: bold;
                                                                            }

                                                                            #callButton {
                                                                                display: none;
                                                                                    margin-top: 30px;
                                                                                        color: white;
                                                                                            font-size: 22px;
                                                                                                text-decoration: underline;
                                                                                                    cursor: pointer;
                                                                                                        opacity: 0;
                                                                                                            transform: translateY(10px);
                                                                                                                transition: opacity 0.8s ease, transform 0.8s ease;
                                                                                                                }

                                                                                                                #callButton.show {
                                                                                                                    opacity: 1;
                                                                                                                        transform: translateY(0);
                                                                                                                        }
                                                                                                                        </style>
                                                                                                                        </head>

                                                                                                                        <body>

                                                                                                                        <div class="container">

                                                                                                                        <h1>lonely village in minecraft is getting bombed</h1>

                                                                                                                        <div id="countdown">00:00:00</div>

                                                                                                                        <div id="message">IT'S TIME </div>

                                                                                                                        <a
                                                                                                                            id="callButton"
                                                                                                                                href="https://call.whatsapp.com/video/89BIdZCh7TdjVow2E9uDlt"
                                                                                                                                    target="_blank">
                                                                                                                                        Join Conversation
                                                                                                                                        </a>

                                                                                                                                        </div>

                                                                                                                                        <script>

                                                                                                                                        let audioContext = null;

                                                                                                                                        function tickSound() {

                                                                                                                                            if (!audioContext) {
                                                                                                                                                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                                                                                                                                                        }

                                                                                                                                                            if (audioContext.state === "suspended") {
                                                                                                                                                                    audioContext.resume();
                                                                                                                                                                        }

                                                                                                                                                                            const oscillator = audioContext.createOscillator();
                                                                                                                                                                                const gain = audioContext.createGain();

                                                                                                                                                                                    oscillator.type = "sine";
                                                                                                                                                                                        oscillator.frequency.value = 900;

                                                                                                                                                                                            gain.gain.setValueAtTime(0.25, audioContext.currentTime);

                                                                                                                                                                                                gain.gain.exponentialRampToValueAtTime(
                                                                                                                                                                                                        0.001,
                                                                                                                                                                                                                audioContext.currentTime + 0.08
                                                                                                                                                                                                                    );

                                                                                                                                                                                                                        oscillator.connect(gain);
                                                                                                                                                                                                                            gain.connect(audioContext.destination);

                                                                                                                                                                                                                                oscillator.start();
                                                                                                                                                                                                                                    oscillator.stop(audioContext.currentTime + 0.08);
                                                                                                                                                                                                                                    }


                                                                                                                                                                                                                                    function updateCountdown() {

                                                                                                                                                                                                                                        const now = new Date();

                                                                                                                                                                                                                                            const target = new Date();

                                                                                                                                                                                                                                                // CEL: 16:25
                                                                                                                                                                                                                                                    target.setHours(17, 45, 0, 0);

                                                                                                                                                                                                                                                        const difference = target - now;

                                                                                                                                                                                                                                                            const countdown = document.getElementById("countdown");
                                                                                                                                                                                                                                                                const message = document.getElementById("message");
                                                                                                                                                                                                                                                                    const callButton = document.getElementById("callButton");


                                                                                                                                                                                                                                                                        // CZAS MINĄŁ
                                                                                                                                                                                                                                                                            if (difference <= 0) {

                                                                                                                                                                                                                                                                                    countdown.style.display = "none";
                                                                                                                                                                                                                                                                                            message.style.display = "block";
                                                                                                                                                                                                                                                                                                    callButton.style.display = "block";

                                                                                                                                                                                                                                                                                                            setTimeout(() => {
                                                                                                                                                                                                                                                                                                                        callButton.classList.add("show");
                                                                                                                                                                                                                                                                                                                                }, 50);

                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                // LINK POJAWIA SIĘ 5 MINUT PRZED
                                                                                                                                                                                                                                                                                                                                                    if (difference <= 5 * 60 * 1000) {

                                                                                                                                                                                                                                                                                                                                                            callButton.style.display = "block";

                                                                                                                                                                                                                                                                                                                                                                    setTimeout(() => {
                                                                                                                                                                                                                                                                                                                                                                                callButton.classList.add("show");
                                                                                                                                                                                                                                                                                                                                                                                        }, 50);
                                                                                                                                                                                                                                                                                                                                                                                            }


                                                                                                                                                                                                                                                                                                                                                                                                const hours = Math.floor(
                                                                                                                                                                                                                                                                                                                                                                                                        difference / (1000 * 60 * 60)
                                                                                                                                                                                                                                                                                                                                                                                                            );

                                                                                                                                                                                                                                                                                                                                                                                                                const minutes = Math.floor(
                                                                                                                                                                                                                                                                                                                                                                                                                        (difference % (1000 * 60 * 60)) /
                                                                                                                                                                                                                                                                                                                                                                                                                                (1000 * 60)
                                                                                                                                                                                                                                                                                                                                                                                                                                    );

                                                                                                                                                                                                                                                                                                                                                                                                                                        const seconds = Math.floor(
                                                                                                                                                                                                                                                                                                                                                                                                                                                (difference % (1000 * 60)) /
                                                                                                                                                                                                                                                                                                                                                                                                                                                        1000
                                                                                                                                                                                                                                                                                                                                                                                                                                                            );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                countdown.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        String(hours).padStart(2, "0") + ":" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                String(minutes).padStart(2, "0") + ":" +
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        String(seconds).padStart(2, "0");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        updateCountdown();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        setInterval(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            updateCountdown();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                tickSound();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }, 1000);


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Odblokowanie dźwięku po pierwszym kliknięciu
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.addEventListener("click", () => {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!audioContext) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            audioContext = new (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.AudioContext ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    window.webkitAudioContext
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            )();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (audioContext.state === "suspended") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            audioContext.resume();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }, { once: true });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
